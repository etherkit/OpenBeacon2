name: firmware2

on:
  pull_request:
    paths:
      - "firmware2/**"
      - ".github/workflows/firmware2.yml"
  push:
    branches:
      - master
    paths:
      - "firmware2/**"
      - ".github/workflows/firmware2.yml"

jobs:
  dxcore:
    name: DxCore AVR128DA48
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli 1.5.1
        run: |
          curl -fsSL -o /tmp/arduino-cli.tgz \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          sudo tar -xzf /tmp/arduino-cli.tgz -C /usr/local/bin arduino-cli
          arduino-cli version

      - name: Compile
        run: firmware2/tools/build.sh

  host:
    name: Host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Test
        run: |
          cmake -S firmware2/host -B firmware2/host/build -DCMAKE_CXX_COMPILER=g++
          cmake --build firmware2/host/build
          ctest --test-dir firmware2/host/build --output-on-failure
